- name: EV-D68 Reference Converter
  description: Converts EV-D68 amino-acid positions to a corrected VP3-VP1 annotation
  url: https://hodcroftlab.github.io/evd68-converter/
  github: https://github.com/hodcroftlab/evd68-converter
  icon: fa-braille

- name: SimPlot-CL
  description: Generate similarity plots for viral genomic sequences from the command line
  github: https://github.com/hodcroftlab/simplot-cl
  icon: fa-chart-line

Nextstrain builds:
- name: EV-D68 Nextstrain Build
  description: Whole genome phylogenetic analysis of EV-D68 
  url: https://nextstrain.org/groups/hodcroftlab/enterovirus/d68/genome
  icon_img: /assets/images/icons/nextstrain-icon.svg

- name: EV-A71 Nextstrain Build
  description: Whole genome phylogenetic analysis of EV-A71 
  url: https://nextstrain.org/groups/hodcroftlab/enterovirus/A71/whole-genome
  icon_img: /assets/images/icons/nextstrain-icon.svg

- name: CVA6 Nextstrain Build
  description: Whole genome phylogenetic analysis of Coxsackievirus A6
  url: https://nextstrain.org/groups/hodcroftlab/coxsackievirus/A6/whole-genome
  icon_img: /assets/images/icons/nextstrain-icon.svg

- name: CVA16 Nextstrain Build
  description: Whole genome phylogenetic analysis of Coxsackievirus A16
  url: https://nextstrain.org/groups/hodcroftlab/coxsackievirus/A16/whole-genome
  icon_img: /assets/images/icons/nextstrain-icon.svg

- name: CVA10 Nextstrain Build
  description: Whole genome phylogenetic analysis of Coxsackievirus A10
  url: https://nextstrain.org/groups/hodcroftlab/coxsackievirus/A10/whole-genome
  icon_img: /assets/images/icons/nextstrain-icon.svg

- name: Polio & EV-C Nextstrain Build
  description: VP1 phylogenetic analysis of Polio & Enterovirus C viruses
  url: https://nextstrain.org/groups/hodcroftlab/enterovirus/c/VP1
  icon_img: /assets/images/icons/nextstrain-icon.svg

