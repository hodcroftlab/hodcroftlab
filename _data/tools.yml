  url: https://clades.nextstrain.org/?dataset-name=enpen/enterovirus/ev-d68 
  icon_img:  /assets/images/icons/Nextclade.svg

- name: CVA16 Nextclade Dataset
  description: Nextclade dataset for aligning, QC, and clade-assignment for CVA16
